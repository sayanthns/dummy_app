<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dummy App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 100%);
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 20px;
            padding: 48px 56px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .ok { font-size: 64px; margin-bottom: 8px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .sub { opacity: 0.7; font-size: 14px; margin-bottom: 28px; }
        .ver {
            display: inline-block; font-size: 40px; font-weight: 800; letter-spacing: 1px;
            padding: 10px 28px; border-radius: 14px;
            background: rgba(255,255,255,0.14); margin-bottom: 24px;
        }
        .meta { font-size: 13px; opacity: 0.65; line-height: 1.8; }
        .meta b { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ok">✅</div>
        <h1>Dummy App is working</h1>
        <div class="sub">install / update / version flow test</div>
        <div class="ver">v{{ version }}</div>
        <div class="meta">
            <div>Site: <b>{{ site }}</b></div>
            <div>Rendered: <b>{{ now }}</b></div>
        </div>
    </div>
</body>
</html>
